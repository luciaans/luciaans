<svg xmlns="http://www.w3.org/2000/svg" width="520" height="346" viewBox="0 0 520 346" role="img" aria-label="Kiki ASCII Art Terminal">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#f778ba;#79c0ff;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#f778ba;#79c0ff;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Terminal Frame -->
  <rect width="520" height="346" rx="8" fill="url(#termBg)" stroke="#30363d" stroke-width="1.2" />
