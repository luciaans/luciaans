  <line x1="0" y1="42" x2="520" y2="42" stroke="#30363d" stroke-width="1" />
  <circle cx="26" cy="21" r="5" fill="#ff5f56" />
  <circle cx="42" cy="21" r="5" fill="#ffbd2e" />
  <circle cx="58" cy="21" r="5" fill="#27c93f" />
  <text x="260" y="25" text-anchor="middle" fill="#7d8590" font-family="monospace" font-size="12">luciaans@cat: ~$ cat kiki.ascii</text>
  <!-- Scanline -->
  <line x1="1" y1="43" x2="519" y2="43" stroke="#58a6ff" stroke-width="1.2" opacity="0.35">
    <animate attributeName="y1" values="43;313;43" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="43;313;43" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.5s" repeatCount="indefinite" />
  </line>
