<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Kiki coding in the Matrix</title>
  <desc id="desc">An animated work-in-progress cat with a green Matrix terminal effect.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07130f"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <filter id="green"><feColorMatrix type="matrix" values="0.15 0 0 0 0.02  0.4 0 0 0 0.25  0.15 0 0 0 0.12  0 0 0 1 0"/><feComponentTransfer><feFuncA type="linear" slope="0.92"/></feComponentTransfer></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screen"><rect x="18" y="52" width="484" height="450" rx="8"/></clipPath>
    <pattern id="lines" width="4" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#39ff88" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="520" height="520" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="12" y="12" width="496" height="496" rx="10" fill="url(#bg)" stroke="#21262d"/>
  <circle cx="30" cy="32" r="5" fill="#ff5f56"/><circle cx="46" cy="32" r="5" fill="#ffbd2e"/><circle cx="62" cy="32" r="5" fill="#27c93f"/>
  <text x="260" y="36" text-anchor="middle" fill="#7dffae" font-family="monospace" font-size="12">kiki@github: ~$ ./cat-matrix.sh</text>
  <rect x="18" y="52" width="484" height="450" rx="8" fill="#020805"/>
  <g clip-path="url(#screen)" font-family="monospace" font-size="15" fill="#39ff88" opacity=".55" filter="url(#glow)">
    <text x="24" y="20">0<animate attributeName="y" values="20;515" dur="3.1s" repeatCount="indefinite"/></text><text x="74" y="200">1<animate attributeName="y" values="-20;515" dur="2.6s" repeatCount="indefinite"/></text><text x="126" y="80">0<animate attributeName="y" values="-70;515" dur="3.6s" repeatCount="indefinite"/></text><text x="184" y="310">1<animate attributeName="y" values="-30;515" dur="2.8s" repeatCount="indefinite"/></text><text x="242" y="120">1<animate attributeName="y" values="-80;515" dur="3.4s" repeatCount="indefinite"/></text><text x="304" y="250">0<animate attributeName="y" values="-40;515" dur="2.4s" repeatCount="indefinite"/></text><text x="366" y="60">1<animate attributeName="y" values="-30;515" dur="3.2s" repeatCount="indefinite"/></text><text x="428" y="180">0<animate attributeName="y" values="-60;515" dur="2.7s" repeatCount="indefinite"/></text><text x="480" y="20">1<animate attributeName="y" values="-10;515" dur="3.8s" repeatCount="indefinite"/></text>
  </g>
  <image href="cat-source.gif" x="65" y="70" width="390" height="405" preserveAspectRatio="xMidYMid meet" filter="url(#green)" opacity=".92"/>
  <rect x="18" y="52" width="484" height="450" fill="url(#lines)" clip-path="url(#screen)"/>
  <rect x="18" y="52" width="484" height="450" fill="none" stroke="#39ff88" stroke-opacity=".28" rx="8"/>
  <text x="30" y="490" fill="#39ff88" font-family="monospace" font-size="12">&gt; work in progress...</text>
</svg>
