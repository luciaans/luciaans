<svg xmlns="http://www.w3.org/2000/svg" width="410px" height="210" viewBox="0 0 410px 210" role="img" aria-label="Kiki ASCII Art">
  <defs>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#f778ba;#79c0ff;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#f778ba;#79c0ff;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background matching Discord card exactly -->
  <rect width="410" height="210" fill="#0d1117" />
  <!-- Scanline -->
  <line x1="0" y1="0" x2="410" y2="0" stroke="#58a6ff" stroke-width="1.2" opacity="0.3">
    <animate attributeName="y1" values="0;210;0" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="0;210;0" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite" />
  </line>
