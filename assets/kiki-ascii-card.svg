<svg xmlns="http://www.w3.org/2000/svg" width="410" height="280" viewBox="0 0 410 280" role="img" aria-label="Kiki ASCII Art Terminal">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#f778ba;#79c0ff;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#f778ba;#79c0ff;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Single Unified Terminal Window -->
  <rect x="0.5" y="0.5" width="409" height="279" rx="8" fill="url(#termBg)" stroke="#30363d" stroke-width="1" />

  <!-- Header Bar -->
  <line x1="0" y1="36" x2="410" y2="36" stroke="#30363d" stroke-width="1" />
  <circle cx="20" cy="18" r="4.5" fill="#ff5f56" />
  <circle cx="34" cy="18" r="4.5" fill="#ffbd2e" />
  <circle cx="48" cy="18" r="4.5" fill="#27c93f" />
  <text x="205" y="22" text-anchor="middle" fill="#7d8590" font-family="monospace" font-size="11">luciaans@cat: ~$ cat kiki.ascii</text>

  <!-- Scanline Animation -->
  <line x1="1" y1="37" x2="409" y2="37" stroke="#58a6ff" stroke-width="1.2" opacity="0.3">
    <animate attributeName="y1" values="37;245;37" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="37;245;37" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- ASCII Art Body -->
