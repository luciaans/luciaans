<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Kiki coding in the Matrix</title>
  <desc id="desc">A dark terminal with green Matrix rain and an animated pixel cat coding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screen"><rect x="26" y="58" width="848" height="270" rx="8"/></clipPath>
  </defs>
  <rect width="900" height="360" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="18" y="18" width="864" height="324" rx="12" fill="url(#bg)" stroke="#21262d"/>
  <circle cx="40" cy="38" r="6" fill="#ff5f56"/><circle cx="60" cy="38" r="6" fill="#ffbd2e"/><circle cx="80" cy="38" r="6" fill="#27c93f"/>
  <text x="450" y="42" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="14">kiki@github: ~/coding</text>
  <rect x="26" y="58" width="848" height="270" rx="8" fill="#050b09"/>
  <g clip-path="url(#screen)" fill="#39ff88" opacity=".55" font-family="monospace" font-size="16" filter="url(#glow)">
    <text x="40" y="90"><tspan>1</tspan><animate attributeName="y" values="80;350" dur="3.2s" repeatCount="indefinite"/></text>
    <text x="110" y="260"><tspan>0</tspan><animate attributeName="y" values="-20;350" dur="2.6s" repeatCount="indefinite"/></text>
    <text x="185" y="130">1<animate attributeName="y" values="-30;350" dur="3.8s" repeatCount="indefinite"/></text>
    <text x="270" y="310">0<animate attributeName="y" values="-40;350" dur="2.9s" repeatCount="indefinite"/></text>
    <text x="350" y="70">1<animate attributeName="y" values="-10;350" dur="3.4s" repeatCount="indefinite"/></text>
    <text x="455" y="220">0<animate attributeName="y" values="-60;350" dur="2.3s" repeatCount="indefinite"/></text>
    <text x="550" y="100">1<animate attributeName="y" values="-30;350" dur="3.1s" repeatCount="indefinite"/></text>
    <text x="650" y="290">0<animate attributeName="y" values="-20;350" dur="2.7s" repeatCount="indefinite"/></text>
    <text x="770" y="150">1<animate attributeName="y" values="-50;350" dur="3.6s" repeatCount="indefinite"/></text>
    <text x="830" y="250">0<animate attributeName="y" values="-30;350" dur="2.5s" repeatCount="indefinite"/></text>
  </g>
  <g transform="translate(302 105)" fill="none" stroke="#9effb8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M65 70 L42 47 L45 20 L70 35 Q112 14 154 35 L179 20 L182 47 L159 70 V151 Q112 178 65 151Z" fill="#10251a"/>
    <path d="M75 82 L95 82 M129 82 L149 82"/>
    <circle cx="86" cy="80" r="4" fill="#39ff88" stroke="none"/><circle cx="138" cy="80" r="4" fill="#39ff88" stroke="none"/>
    <path d="M103 101 Q112 108 121 101 M112 108 V119"/>
    <path d="M65 105 L23 96 M65 119 L20 120 M159 105 L201 96 M159 119 L204 120"/>
    <path d="M82 151 L70 183 M142 151 L154 183"/>
    <path d="M188 174 Q235 174 258 145 Q277 121 299 143"/>
    <rect x="215" y="128" width="100" height="62" rx="5" fill="#0d1117"/>
    <path d="M226 145 H292 M226 158 H275 M226 171 H286" stroke="#39ff88" stroke-width="3"/>
    <path d="M280 195 Q290 207 306 199"/>
    <animateTransform attributeName="transform" type="translate" values="302 105;302 101;302 105" dur="2s" repeatCount="indefinite"/>
  </g>
  <text x="38" y="310" fill="#39ff88" font-family="monospace" font-size="14">&gt; compiling dreams...</text>
  <rect x="240" y="309" width="9" height="16" fill="#39ff88"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
